<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10142e" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8f8ff;
        --muted: #b8bddb;
        --card: rgba(22, 27, 61, 0.64);
        --line: rgba(255, 255, 255, 0.14);
        --violet: #9b8cff;
        --cyan: #62e5ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 17% 18%, rgba(98, 229, 255, 0.25), transparent 24rem),
          radial-gradient(circle at 83% 82%, rgba(155, 140, 255, 0.28), transparent 25rem),
          #10142e;
      }

      .orb {
        position: fixed;
        width: 300px;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.65;
        pointer-events: none;
        animation: drift 10s ease-in-out infinite alternate;
      }

      .orb.one { top: -115px; right: -80px; background: #7658ff; }
      .orb.two { bottom: -120px; left: -95px; background: #00c2df; animation-delay: -4s; }

      main {
        position: relative;
        width: min(680px, 100%);
        padding: clamp(2.2rem, 7vw, 4.8rem);
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32), inset 0 1px rgba(255, 255, 255, 0.09);
        backdrop-filter: blur(18px);
        animation: rise 850ms cubic-bezier(.2,.8,.2,1) both;
      }

      nav {
        position: absolute;
        top: 22px;
        right: clamp(1.4rem, 4vw, 2.4rem);
        display: flex;
        gap: 18px;
      }

      nav a {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 650;
        text-decoration: none;
        transition: color 160ms ease;
      }

      nav a:hover, nav a:focus-visible { color: var(--cyan); }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 13px;
        border: 1px solid rgba(98, 229, 255, 0.35);
        border-radius: 999px;
        color: var(--cyan);
        background: rgba(98, 229, 255, 0.08);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 14px var(--cyan);
      }

      h1 {
        margin: 28px 0 16px;
        font-size: clamp(3rem, 10vw, 6.8rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
        background: linear-gradient(120deg, #fff 20%, var(--cyan) 55%, var(--violet));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 480px;
        margin: 0 auto;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.18rem);
        line-height: 1.7;
      }

      .footer {
        margin-top: 34px;
        color: #8e95bd;
        font-size: 0.88rem;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes drift {
        to { transform: translate(35px, 28px) scale(1.12); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <main>
      <nav aria-label="Primary navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="badge"><span class="dot"></span> It works</div>
      <h1>Hello,<br />World!</h1>
      <p>A small beginning with a little sparkle. Your next great idea can start right here.</p>
      <div class="footer">Made with HTML, CSS, and good energy ✦</div>
    </main>
  </body>
</html>
