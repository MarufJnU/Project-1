<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10142e" />
    <title>Contact</title>
    <style>
      :root { color-scheme: dark; --ink: #f8f8ff; --muted: #b8bddb; --card: rgba(22,27,61,.64); --line: rgba(255,255,255,.14); --violet: #9b8cff; --cyan: #62e5ff; } * { box-sizing: border-box; } body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow-x: hidden; padding: 24px; font-family: Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: var(--ink); background: radial-gradient(circle at 17% 18%,rgba(98,229,255,.25),transparent 24rem),radial-gradient(circle at 83% 82%,rgba(155,140,255,.28),transparent 25rem),#10142e; } .orb { position: fixed; width: 300px; aspect-ratio: 1; border-radius: 50%; filter: blur(2px); opacity: .65; pointer-events: none; animation: drift 10s ease-in-out infinite alternate; } .orb.one { top: -115px; right: -80px; background: #7658ff; } .orb.two { bottom: -120px; left: -95px; background: #00c2df; animation-delay: -4s; } main { position: relative; width: min(680px,100%); padding: clamp(5.2rem,9vw,6.2rem) clamp(2.2rem,7vw,4.8rem) clamp(2.2rem,7vw,4.8rem); border: 1px solid var(--line); border-radius: 28px; background: var(--card); box-shadow: 0 24px 80px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.09); backdrop-filter: blur(18px); animation: rise 850ms cubic-bezier(.2,.8,.2,1) both; } nav { position: absolute; top: 22px; right: clamp(1.4rem,4vw,2.4rem); display: flex; gap: 18px; } nav a { color: var(--muted); font-size: .9rem; font-weight: 650; text-decoration: none; transition: color 160ms ease; } nav a:hover,nav a:focus-visible,nav a[aria-current="page"] { color: var(--cyan); } .eyebrow { color: var(--cyan); font-size: .82rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; } h1 { margin: 17px 0; font-size: clamp(2.8rem,8vw,5.4rem); line-height: .98; letter-spacing: -.06em; background: linear-gradient(120deg,#fff 20%,var(--cyan) 55%,var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; } p { margin: 0 0 24px; color: var(--muted); font-size: clamp(1rem,2.5vw,1.14rem); line-height: 1.7; } form { display: grid; gap: 14px; } label { color: var(--muted); font-size: .9rem; font-weight: 650; } input,textarea { width: 100%; margin-top: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); background: rgba(8,11,35,.5); font: inherit; } textarea { min-height: 100px; resize: vertical; } input:focus,textarea:focus { outline: 2px solid var(--cyan); outline-offset: 2px; } button { justify-self: start; border: 0; border-radius: 999px; padding: 12px 19px; color: #10142e; background: var(--cyan); cursor: pointer; font: inherit; font-weight: 750; } @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: none; } } @keyframes drift { to { transform: translate(35px,28px) scale(1.12); } } @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div>
    <main>
      <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <div class="eyebrow">Let’s make something</div>
      <h1>Say hello.</h1>
      <p>Have an idea, a question, or simply want to connect? Leave a note below.</p>
      <form action="#" method="post">
        <label>Name<input name="name" autocomplete="name" required /></label>
        <label>Email<input type="email" name="email" autocomplete="email" required /></label>
        <label>Message<textarea name="message" required></textarea></label>
        <button type="submit">Send message</button>
      </form>
    </main>
  </body>
</html>
